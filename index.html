<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Super Colmado Ana Bomby #2</title>
<meta name="theme-color" content="#0E2BA8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ana Bomby">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --rojo:#E4141B;--rojo2:#B50E14;--azul:#1235C4;--azulB:#0E2BA8;--azul2:#081C73;--amar:#FFD60A;--amar2:#F2B400;
  --ok:#0F9D58;--okBg:#E3F6EC;--warn:#C77700;--warnBg:#FFF3D6;--badBg:#FFE5E6;
  --bg:#F2F4FA;--card:#FFFFFF;--card2:#F6F7FB;--tx:#0E1630;--tx2:#5C6684;--tx3:#8E97B0;--ln:#E4E8F1;
  --azulTx:#1235C4;--azulBg:#E8EDFF;--rojoTx:#D0121A;
  --sh:0 1px 2px rgba(14,22,48,.05),0 6px 20px rgba(14,22,48,.06);
  --sh2:0 12px 40px rgba(14,22,48,.18);
  --r:20px;--r2:14px;
  --safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px);
  --nav:72px;
}
[data-theme=dark]{
  --bg:#080D1C;--card:#121A30;--card2:#19223D;--tx:#EEF2FF;--tx2:#A3ADC9;--tx3:#6E7899;--ln:#232D4D;
  --azulTx:#8FA6FF;--azulBg:#1B2650;--rojoTx:#FF6B70;--okBg:#0F2E22;--warnBg:#33270C;--badBg:#3A1418;--ok:#34C77B;--warn:#FFB938;
  --sh:0 1px 0 rgba(255,255,255,.03);--sh2:0 12px 40px rgba(0,0,0,.6);
}
[hidden]{display:none!important}
[data-a],[data-lp]{cursor:pointer}
html{touch-action:manipulation}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--tx2)}.small{font-size:13px}.tiny{font-size:12px}
.b{font-weight:800}.bb{font-weight:900}

/* ---------- Layout ---------- */
.app{min-height:100%;display:flex}
.side{display:none}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
header.top{position:sticky;top:0;z-index:30;color:#fff;padding:calc(var(--safeT) + 10px) 16px 12px;
  background:radial-gradient(120% 140% at 100% 0%,#2C55F0 0%,var(--azulB) 45%,var(--azul2) 100%);
  display:flex;align-items:center;gap:8px;box-shadow:0 4px 18px rgba(8,28,115,.25)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--rojo) 0 33%,var(--amar) 33% 66%,#fff 66%)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.brand .t1{font-size:11px;letter-spacing:.14em;font-weight:900;color:var(--amar);line-height:1}
.brand .t2{font-size:20px;font-weight:900;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:40px;height:40px;flex:none;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.12);position:relative;transition:transform .15s}
.hbtn:active{transform:scale(.92)}
.hbtn .dot[hidden]{display:none}
.hbtn .dot{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--rojo);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px var(--azulB)}
main{flex:1;padding:16px 16px calc(var(--nav) + var(--safeB) + 28px);max-width:1180px;width:100%;margin:0 auto}
.vtitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.vtitle h1{font-size:26px;font-weight:900;margin:0;letter-spacing:-.01em}
.vtitle p{margin:2px 0 0;color:var(--tx2);font-size:14px}

/* bottom nav */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--ln);
  padding:6px 8px calc(6px + var(--safeB));display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -6px 24px rgba(14,22,48,.06)}
nav.bot button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:800;color:var(--tx3);position:relative}
nav.bot button .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
nav.bot button.on{color:var(--azulTx)}
nav.bot button.on .pill{background:var(--azulBg)}
nav.bot button .bdg{position:absolute;top:2px;left:calc(50% + 8px);background:var(--rojo);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:900}
nav.bot .sell{margin-top:-26px}
nav.bot .sell .pill{width:62px;height:62px;border-radius:50%;background:linear-gradient(160deg,#FF3B41,var(--rojo2));color:#fff;box-shadow:0 8px 20px rgba(228,20,27,.42),0 0 0 5px var(--card),0 0 0 7px var(--amar)}
nav.bot .sell.on .pill{background:linear-gradient(160deg,#FF3B41,var(--rojo2))}
nav.bot .sell svg.i{width:28px;height:28px}
nav.bot .sell span.l{color:var(--rojoTx)}

/* ---------- Cards & common ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--ln)}
[data-theme=light] .card{border-color:transparent}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec h2{font-size:18px;font-weight:900;margin:0}
.sec a,.link{color:var(--azulTx);font-weight:800;font-size:14px;cursor:pointer}
.btn{height:50px;padding:0 18px;border-radius:15px;font-weight:900;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--azul);color:#fff;box-shadow:0 6px 16px rgba(18,53,196,.28)}
.btn.red{background:linear-gradient(160deg,#FF3B41,var(--rojo2));color:#fff;box-shadow:0 6px 16px rgba(228,20,27,.3)}
.btn.yel{background:var(--amar);color:#2A2000}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn.line{border:1.5px solid var(--ln);background:var(--card)}
.btn.ok{background:var(--ok);color:#fff}
.btn.full{width:100%}
.btn.sm{height:40px;font-size:14px;border-radius:12px;padding:0 14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2);color:var(--tx2)}
.ibtn:active{transform:scale(.92)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 15px;border-radius:19px;background:var(--card);border:1.5px solid var(--ln);font-weight:800;font-size:14px;color:var(--tx2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
.chip.warn.on{background:var(--rojo);border-color:var(--rojo)}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:42px;border-radius:11px;font-weight:800;font-size:14px;color:var(--tx2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
[data-theme=dark] .seg button.on{background:var(--azul);color:#fff}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--ln);border-radius:16px;padding:0 14px;height:50px;color:var(--tx3)}
.search:focus-within{border-color:var(--azul);box-shadow:0 0 0 4px var(--azulBg)}
.search input{flex:1;border:0;outline:0;background:none;height:100%;min-width:0}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;font-weight:800;color:var(--tx2);margin:0 0 6px 2px}
.inp{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--ln);background:var(--card2);padding:0 14px;outline:0;transition:border .15s,box-shadow .15s}
textarea.inp{height:auto;min-height:70px;padding:12px 14px;resize:vertical}
.inp:focus{border-color:var(--azul);background:var(--card);box-shadow:0 0 0 4px var(--azulBg)}
.inp.big{height:64px;font-size:28px;font-weight:900;text-align:center}
.money{position:relative}
.money::before{content:"RD$";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--tx3);font-size:15px;pointer-events:none}
.money .inp{padding-left:52px}
.money .inp.big{padding-left:14px}
.money.bigm::before{font-size:18px;left:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pillS{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:900;white-space:nowrap}
.p-ok{background:var(--okBg);color:var(--ok)}.p-warn{background:var(--warnBg);color:var(--warn)}.p-bad{background:var(--badBg);color:var(--rojoTx)}.p-blue{background:var(--azulBg);color:var(--azulTx)}.p-gray{background:var(--card2);color:var(--tx2)}
.empty{text-align:center;padding:34px 18px;color:var(--tx2)}
.empty .em{font-size:46px;margin-bottom:6px}
.empty h3{color:var(--tx);margin:4px 0 4px;font-size:18px;font-weight:900}
.empty p{margin:0 auto 16px;max-width:300px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--ln);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .15s}
.li:last-child{border-bottom:0}
.li:active{background:var(--card2)}
.li.sel{background:var(--azulBg)}
.li .ck{display:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--tx3);flex:none;place-items:center}
.selmode .li .ck{display:grid}
.selmode~* .fab,.selmode .fab{display:none}
.selbar .t{white-space:nowrap}
.li.sel .ck{background:var(--azul);border-color:var(--azul);color:#fff}
.li.sel .ck svg{width:15px;height:15px;stroke-width:3}
.av{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-weight:900;font-size:17px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.amt{font-weight:900;text-align:right;white-space:nowrap}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + var(--safeB) + 18px);z-index:35;height:58px;padding:0 22px 0 18px;border-radius:29px;background:var(--azul);color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px rgba(18,53,196,.4)}
.fab:active{transform:scale(.95)}
.hint{text-align:center;font-size:12.5px;color:var(--tx3);margin:12px 0 0}

/* ---------- Home ---------- */
.hero{border-radius:24px;padding:18px;color:#fff;position:relative;overflow:hidden;
 background:linear-gradient(135deg,var(--rojo) 0%,#C70F16 55%,#9E0A10 100%);box-shadow:0 14px 30px rgba(228,20,27,.28)}
.hero>*{position:relative;z-index:1}
.hero .hi{font-size:14px;opacity:.9;font-weight:700}
.hero .big{font-size:36px;font-weight:900;letter-spacing:-.02em;margin:4px 0 0;line-height:1.05}
.hero .sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hero .tag{background:rgba(255,255,255,.18);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:800}
.hero .seg{background:rgba(0,0,0,.18);margin-top:14px}
.hero .seg button{color:rgba(255,255,255,.85);height:38px}
.hero .seg button.on{background:#fff;color:var(--rojo2)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.kpi{padding:14px}
.kpi .lab{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--tx2)}
.kpi .ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
.kpi .ico svg{width:17px;height:17px}
.kpi .val{font-size:22px;font-weight:900;margin:8px 0 4px;letter-spacing:-.01em}
.delta{font-size:12px;font-weight:900;display:inline-flex;align-items:center;gap:3px}
.delta.up{color:var(--ok)}.delta.dn{color:var(--rojoTx)}.delta.eq{color:var(--tx3)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--tx2);text-align:center}
.qa .ic{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;transition:transform .15s}
.qa:active .ic{transform:scale(.92)}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding:10px 4px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bar .v{font-size:10.5px;font-weight:900;color:var(--tx2)}
.bar .c{width:100%;max-width:38px;border-radius:9px 9px 5px 5px;background:var(--azulBg);min-height:6px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bar.today .c{background:linear-gradient(180deg,var(--amar),var(--amar2))}
.bar .d{font-size:12px;font-weight:800;color:var(--tx3)}
.bar.today .d{color:var(--tx)}

/* ---------- POS ---------- */
.pos{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:12px}
.pc{background:var(--card);border-radius:18px;padding:8px 8px 10px;box-shadow:var(--sh);border:1.5px solid transparent;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative;transition:transform .1s,border-color .2s;user-select:none;-webkit-user-select:none}
[data-theme=dark] .pc{border-color:var(--ln)}
.pc:active{transform:scale(.95)}
.pc .ph{aspect-ratio:1;border-radius:13px;display:grid;place-items:center;font-size:34px;overflow:hidden}
.pc .ph img{width:100%;height:100%;object-fit:cover}
.pc .n{font-size:13px;font-weight:800;line-height:1.2;height:31px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc .p{font-size:15px;font-weight:900;color:var(--azulTx)}
.pc .q{position:absolute;top:12px;right:12px;min-width:26px;height:26px;border-radius:13px;background:var(--rojo);color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center;padding:0 7px;box-shadow:0 3px 8px rgba(228,20,27,.4);animation:pop .25s}
.pc.inc{border-color:var(--rojo)}
.pc .st{position:absolute;top:12px;left:12px}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + var(--safeB) + 10px);z-index:36;background:var(--azul2);color:#fff;border-radius:20px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 30px rgba(8,28,115,.45);transform:translateY(160%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.cartbar.on{transform:none}
.cartbar.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.03)}}
.cartbar .cnt{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.14);display:grid;place-items:center;position:relative}
.cartbar .cnt b{position:absolute;top:-6px;right:-6px;background:var(--amar);color:#2A2000;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.cartbar .tt{flex:1;line-height:1.15}
.cartbar .tt small{opacity:.75;font-size:12px;font-weight:700}
.cartbar .tt div{font-size:19px;font-weight:900}
.cartbar .go{background:var(--amar);color:#2A2000;height:46px;border-radius:14px;padding:0 16px;font-weight:900;display:flex;align-items:center;gap:6px}
.citem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--ln)}
.citem .av{width:40px;height:40px;border-radius:12px;font-size:20px}
.stepper{display:flex;align-items:center;background:var(--card2);border-radius:12px;height:38px}
.stepper button{width:36px;height:38px;display:grid;place-items:center;color:var(--azulTx)}
.stepper button svg{width:18px;height:18px;stroke-width:2.6}
.stepper .qv{min-width:34px;text-align:center;font-weight:900;font-size:15px}
.tot{border-top:2px solid var(--ln);margin-top:8px;padding-top:10px}
.tot .r{display:flex;justify-content:space-between;padding:3px 0;color:var(--tx2);font-weight:700}
.tot .r.big{color:var(--tx);font-size:24px;font-weight:900;padding-top:6px}
.gan{display:flex;align-items:center;justify-content:space-between;background:var(--okBg);color:var(--ok);border-radius:12px;padding:8px 12px;font-weight:900;font-size:14px;margin-top:8px}
.gan button{color:inherit;display:flex}
.devuelta{display:flex;justify-content:space-between;align-items:center;background:var(--warnBg);border-radius:14px;padding:12px 14px;margin-top:10px;font-weight:900}
.devuelta .v{font-size:22px;color:var(--warn)}
.lbl{font-size:13px;font-weight:800;color:var(--tx2);margin:16px 2px 8px}
.cpanel{display:none}
.pick{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;border:1.5px dashed var(--ln);width:100%;text-align:left}
.pick.set{border-style:solid;border-color:var(--azul);background:var(--azulBg)}

/* ---------- Sheets & dialogs ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:80;pointer-events:none}
.sheet-bg{position:absolute;inset:0;background:rgba(6,10,25,.5);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;background:var(--card);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:var(--sh2)}
.sheet-wrap.on{pointer-events:auto}
.sheet-wrap.on .sheet-bg{opacity:1}
.sheet-wrap.on .sheet{transform:none}
.grab{padding:10px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{width:44px;height:5px;border-radius:3px;background:var(--ln)}
#sheetBody{overflow-y:auto;padding:4px 18px calc(18px + var(--safeB));overscroll-behavior:contain}
.sh-h{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.sh-h h3{margin:0;font-size:21px;font-weight:900;flex:1}
.sticky-foot{position:sticky;bottom:calc(-18px - var(--safeB));background:var(--card);padding:12px 0 calc(6px + var(--safeB));margin-top:10px;border-top:1px solid var(--ln)}
.dlg-wrap{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:24px;background:rgba(6,10,25,.55)}
.dlg-wrap.on{display:grid;animation:fade .2s}
.dlg{background:var(--card);border-radius:24px;padding:22px;width:100%;max-width:380px;box-shadow:var(--sh2);animation:up .25s cubic-bezier(.2,.9,.25,1)}
.dlg h3{margin:0 0 6px;font-size:20px;font-weight:900}
.dlg p{margin:0 0 18px;color:var(--tx2)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(20px) scale(.96);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safeB) + 86px);transform:translate(-50%,20px);background:#111A33;color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;z-index:120;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;display:flex;gap:8px;align-items:center;box-shadow:var(--sh2)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.selbar{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--azul2);color:#fff;padding:calc(var(--safeT) + 10px) 12px 10px;display:flex;align-items:center;gap:10px;transform:translateY(-110%);transition:transform .25s}
.selbar.on{transform:none}
.selbar .t{flex:1;font-weight:900;font-size:17px}
.selbar button.x{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.12)}
.success{text-align:center;padding:10px 0 4px}
.success .ck{width:86px;height:86px;border-radius:50%;margin:6px auto 12px;background:var(--okBg);color:var(--ok);display:grid;place-items:center;animation:pop .45s}
.success .ck svg{width:46px;height:46px;stroke-width:3}
.photo{width:120px;height:120px;border-radius:24px;margin:0 auto 16px;display:grid;place-items:center;background:var(--card2);border:2px dashed var(--ln);overflow:hidden;position:relative;font-size:44px;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .cam{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:11px;background:var(--azul);color:#fff;display:grid;place-items:center}
.photo .cam svg{width:18px;height:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:120px}
.tile .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center}
.tile b{font-size:16px;font-weight:900}
.tile span{font-size:13px;color:var(--tx2);font-weight:700}
.dcard{padding:14px;margin-bottom:12px}
.steps{display:flex;gap:4px;margin:12px 0}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--ln)}
.steps i.on{background:var(--azul)}
.steps.done i{background:var(--ok)}
.daygrp{font-size:13px;font-weight:900;color:var(--tx3);margin:18px 4px 8px;text-transform:capitalize}

/* ---------- Ticket ---------- */
.sw{width:50px;height:30px;border-radius:15px;background:var(--ln);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.tgrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.tk{background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.35;padding:10px 12px}
.tk-c{text-align:center}.tk-b{font-weight:700}.tk-big{font-size:15px}
.tk-r{display:flex;justify-content:space-between;gap:8px}.tk-r span:last-child{white-space:nowrap;text-align:right}
.tk-hr{border-top:1px dashed #000;margin:6px 0}
.tk-logo{display:block;width:60%;max-width:34mm;margin:0 auto 4px;filter:grayscale(1) contrast(1.4)}
.tkprev{margin:0 auto;box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:4px}
#ticket{display:none}
@media print{
 body>*:not(#ticket){display:none!important}
 html,body{background:#fff!important;height:auto!important;overflow:visible!important}
 #ticket{display:block!important;margin:0;padding:1mm 2mm}
}
/* ---------- Reportes ---------- */
.repg{display:grid;gap:14px;margin-top:14px}
.repg .card{min-width:0}
.rh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rh h2{font-size:17px;font-weight:900;margin:0}
.vtip{min-height:20px;font-size:13px;font-weight:800;color:var(--tx2);margin-bottom:8px}
.vb{display:flex;align-items:flex-end;gap:2px;border-bottom:1.5px solid var(--ln)}
.vbc{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;min-width:0}
.vbc i{display:block;width:100%;max-width:30px;background:var(--azulTx);border-radius:4px 4px 0 0;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.vbc.hi i{background:var(--amar2)}.vbc.on i{background:var(--rojo)}
.vbx{display:flex;gap:2px;margin-top:5px}.vbx span{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--tx3);min-width:0;white-space:nowrap}
.hb{display:grid;gap:12px}
.hbl{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;margin-bottom:5px}.hbl b{white-space:nowrap}
.hbt{height:10px;background:var(--card2);border-radius:5px;overflow:hidden}.hbt i{display:block;height:100%;background:var(--azulTx);border-radius:5px}
.tops{display:grid;gap:14px}
.topr{display:flex;align-items:center;gap:10px}
.rk-n{width:26px;text-align:center;font-weight:900;color:var(--tx3);flex:none}.rk-n.top3{color:var(--amar2)}
.topr .av{width:40px;height:40px;font-size:20px}
.kpis.rk .val{font-size:clamp(17px,5vw,21px);white-space:nowrap}
/* ---------- Contraseña ---------- */
.lock{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(var(--safeT) + 20px) 20px calc(var(--safeB) + 20px);color:#fff;
 background:radial-gradient(120% 90% at 50% 0%,#2C55F0 0%,var(--azulB) 45%,var(--azul2) 100%);user-select:none;-webkit-user-select:none}
.lock.on{display:flex}
.lock img{width:92px;height:92px;border-radius:50%;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35);margin-bottom:6px}
.lock .lt{font-size:22px;font-weight:900}.lock .ls{font-size:14px;opacity:.8;text-align:center;min-height:19px;max-width:300px}
.dots{display:flex;gap:16px;margin:18px 0 22px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.75);transition:background .15s}
.dots i.f{background:var(--amar);border-color:var(--amar)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:16px 22px}
.keys button{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.13);font-size:30px;font-weight:800;color:#fff;transition:background .1s,transform .1s}
.keys button:active{background:rgba(255,255,255,.3);transform:scale(.94)}
.keys button[disabled]{opacity:.35}
.keys .kx{background:none;font-size:24px}.keys .kx.ok{font-size:17px;background:var(--amar);color:#2A2000}
.lock .lk{margin-top:18px;color:#fff;opacity:.85;font-weight:800;font-size:15px;padding:10px}
@media (max-height:640px){.keys{grid-template-columns:repeat(3,64px)}.keys button{width:64px;height:64px;font-size:26px}.lock img{width:64px;height:64px}.dots{margin:10px 0 14px}}
/* ---------- Desktop ---------- */
@media (min-width:900px){
  .repg{grid-template-columns:1fr 1fr}.repg .span2{grid-column:1/-1}
  .side{overflow-y:auto;display:flex;flex-direction:column;width:260px;flex:none;position:sticky;top:0;height:100vh;padding:20px 14px;
    background:radial-gradient(130% 80% at 0% 0%,#2C55F0 0%,var(--azulB) 40%,var(--azul2) 100%);color:#fff;gap:4px}
  .side .logo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin:4px 0 18px}
  .side .logo img{width:110px;height:110px;border-radius:50%;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .side .logo .t1{font-size:12px;letter-spacing:.16em;color:var(--amar);font-weight:900}
  .side .logo .t2{font-size:22px;font-weight:900;line-height:1}
  .side button{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:14px;font-weight:800;color:rgba(255,255,255,.8);text-align:left}
  .side button:hover{background:rgba(255,255,255,.08)}
  .side button.on{background:#fff;color:var(--azulB)}
  .side button.sellbtn{background:var(--rojo);color:#fff;margin:4px 0 10px;box-shadow:0 8px 18px rgba(228,20,27,.4)}
  .side .bdg{margin-left:auto;background:var(--rojo);color:#fff;font-size:11px;border-radius:9px;padding:1px 7px}
  .side .sp{flex:1}
  nav.bot,header.top{display:none}
  main{padding:28px 32px 40px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .homeg{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start}
  .pos{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:22px;align-items:start}
  .cpanel{display:block;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
  .cartbar{display:none}
  .homeg>div{min-width:0}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .fab{bottom:28px;right:32px}
  .sheet{left:50%;right:auto;width:520px;bottom:50%;transform:translate(-50%,60%) scale(.96);opacity:0;border-radius:26px;max-height:88vh;transition:all .25s}
  .sheet-wrap.on .sheet{transform:translate(-50%,50%);opacity:1}
  .grab{display:none}
  #sheetBody{padding-top:20px}
  .toast{bottom:30px}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .selbar{left:260px}
  .chips{margin:0;padding-left:2px;padding-right:2px}
}
@media (max-width:370px){.brand .t2{font-size:17px}.kpi .val{font-size:19px}}
</style>

<script>
"use strict";
/* ============ Utilidades ============ */
const $=s=>document.querySelector(s);
const ic=(n,c='')=>`<svg class="i ${c}"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};

/* ============ Base de datos (IndexedDB) ============ */
const DB={db:null,mem:{kv:new Map(),fotos:new Map(),respaldos:new Map()},
 open(){return new Promise(res=>{try{const r=indexedDB.open('anabomby',1);
  r.onupgradeneeded=()=>{const d=r.result;['kv','fotos','respaldos'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};
  r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
 tx(st,mode,fn){if(!this.db){return Promise.resolve(fn(null))}return new Promise((res,rej)=>{const t=this.db.transaction(st,mode);const s=t.objectStore(st);const q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
 get(st,k){if(!this.db)return Promise.resolve(this.mem[st].get(k));return this.tx(st,'readonly',s=>s.get(k))},
 put(st,k,v){if(!this.db){this.mem[st].set(k,v);return Promise.resolve()}return this.tx(st,'readwrite',s=>s.put(v,k))},
 del(st,k){if(!this.db){this.mem[st].delete(k);return Promise.resolve()}return this.tx(st,'readwrite',s=>s.delete(k))},
 clear(st){if(!this.db){this.mem[st].clear();return Promise.resolve()}return this.tx(st,'readwrite',s=>s.clear())},
 async entries(st){if(!this.db)return [...this.mem[st].entries()];const ks=await this.tx(st,'readonly',s=>s.getAllKeys());const vs=await this.tx(st,'readonly',s=>s.getAll());return ks.map((k,i)=>[k,vs[i]])}
};

function fotoSrc(id){const d=FOTOS[id];if(!d)return null;if(!FURL[id]||FURL[id].d!==d){try{const [h,b]=d.split(',');const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 if(FURL[id])URL.revokeObjectURL(FURL[id].u);FURL[id]={d,u:URL.createObjectURL(new Blob([u],{type:(h.match(/:(.*?);/)||[,'image/jpeg'])[1]}))}}catch(e){return d}}return FURL[id].u}
function prepFotos(){const ids=Object.keys(FOTOS).filter(id=>!FURL[id]);let i=0;const step=()=>{const end=Math.min(i+15,ids.length);for(;i<end;i++)fotoSrc(ids[i]);if(i<ids.length)(window.requestIdleCallback||setTimeout)(step)};step()}

/* ============ Estadísticas ============ */
function rango(per,off){const now=Date.now();
 if(per==='hoy'){const a=sod(now)-off*DAY;return [a,now-off*DAY]}
 const n=per==='semana'?7:30;const a=sod(now)-(n-1)*DAY;const len=n*DAY;return [a-off*len,now-off*len]}
function stats(a,b){const vs=vivas().filter(v=>v.fecha>=a&&v.fecha<b);const gs=S.gastos.filter(g=>g.fecha>=a&&g.fecha<b);
 const ventas=vs.reduce((s,v)=>s+v.total-(v.envio||0),0),gan=vs.reduce((s,v)=>s+v.gan,0),gastos=gs.reduce((s,g)=>s+g.monto,0);
 return {n:vs.length,ventas,gan,gastos,neto:gan-gastos,vs}}
function delta(a,b,inv=false){if(!b&&!a)return `<span class="delta eq">— sin cambio</span>`;if(!b){const g=inv?a<=0:a>=0;return `<span class="delta ${g?'up':'dn'}">${g?'▲':'▼'} nuevo</span>`}
 const p=Math.round((a-b)/Math.abs(b)*100);if(p===0)return `<span class="delta eq">= igual</span>`;const good=inv?p<0:p>0;
 return `<span class="delta ${good?'up':'dn'}">${p>0?'▲':'▼'} ${Math.abs(p)}%</span>`}

V.delivery=()=>{

function dcard(v){const e=v.entrega,ix=EST.findIndex(x=>x.k===e.estado),es=EST[ix],c=cli(v.clienteId),sd=saldo(v);
 const next=EST[ix+1];const tel=e.tel||(c&&c.tel);

  <div style="text-align:right"><div class="amt num">${fmt(v.total)}</div><div class="tiny b" style="color:${sd>0?'var(--warn)':'var(--ok)'}">${sd>0?(v.metodo==='fiao'?'Fiao':'Cobrar al entregar'):'Pagado'}</div></div></div>

  ${e.nota?`<div class="small" style="background:var(--warnBg);border-radius:10px;padding:8px 10px;margin-bottom:10px">📝 ${esc(e.nota)}</div>`:''}
  <div class="row" style="gap:8px">
   ${tel?`<a class="ibtn" target="_blank" rel="noopener" href="${wa(tel,`Hola 👋, le escribe Super Colmado Ana Bomby #2 sobre su pedido #${v.num} (${fmt(v.total)}).`)}" aria-label="WhatsApp">${ic('wa')}</a><a class="ibtn" href="tel:${esc(tel)}" aria-label="Llamar">${ic('phone')}</a>`:''}
   ${e.dir?`<a class="ibtn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.dir)}" aria-label="Mapa">${ic('pin')}</a>`:''}
   <div class="grow"></div>
   ${next?`<button class="btn ${next.k==='entregado'?'ok':'pri'} sm" data-a="avanzar" data-id="${v.id}">${next.k==='preparando'?'Preparar':next.k==='camino'?'Enviar':'Entregado'} ${ic(next.k==='entregado'?'check':'right')}</button>`:`<span class="muted small">${fHora(e.hist&&e.hist.length?e.hist[e.hist.length-1].t:v.fecha)}</span>`}

function histListHTML(){const q=norm(Q.hist);let vs=[...S.ventas].sort((a,b)=>b.fecha-a.fecha);
 if(VTAB==='fiao')vs=vs.filter(v=>v.metodo==='fiao');if(VTAB==='anuladas')vs=vs.filter(v=>v.anulada);else vs=vs.filter(v=>!v.anulada);
 if(q)vs=vs.filter(v=>norm(nomCli(v)).includes(q)||String(v.num)===Q.hist.replace('#','')||v.items.some(i=>norm(i.nombre).includes(q)));
 const byDay={};vs.forEach(v=>{(byDay[dkey(v.fecha)]=byDay[dkey(v.fecha)]||[]).push(v)});
 let last='';
 return `${vs.length?vs.slice(0,200).map(v=>{const k=dkey(v.fecha);let h='';if(k!==last){const dv=byDay[k];h=`<div class="daygrp row" style="justify-content:space-between"><span>${sod(v.fecha)===sod(Date.now())?'Hoy':fFecha(v.fecha,{weekday:'long',day:'numeric',month:'long'})}</span><span class="num">${fmt(dv.reduce((a,x)=>a+x.total,0))}</span></div>`}last=k;const sd=saldo(v);
  return h+`<div class="card list" style="margin-bottom:8px"><div class="li" data-a="verVenta" data-id="${v.id}"><div class="av" style="background:${v.tipo==='delivery'?'var(--azulBg)':'var(--card2)'};font-size:20px">${v.tipo==='delivery'?'🛵':v.metodo==='fiao'?'📒':v.metodo==='transferencia'?'🏦':'💵'}</div><div class="grow"><div class="b ell">#${v.num} · ${esc(nomCli(v))}</div><div class="muted small ell">${fHora(v.fecha)} · ${esc(v.items.map(i=>i.nombre).join(', '))}</div></div><div style="text-align:right"><div class="amt num" style="${v.anulada?'text-decoration:line-through;color:var(--tx3)':''}">${fmt(v.total)}</div>${sd>0?`<div class="tiny b" style="color:var(--rojoTx)">Debe ${fmt(sd)}</div>`:''}</div></div></div>`}).join('')
 :`<div class="card empty" style="margin-top:12px"><div class="em">🧾</div><h3>No hay ventas aquí</h3><p>Las ventas que hagas aparecerán en esta lista.</p></div>`}`}

function startSel(list,id){SEL={list,ids:new Set([id])};vib(25);renderSel();render()}

function renderSel(){const b=$('#selbar');b.classList.toggle('on',!!SEL.list);if(!SEL.list)return;
 b.innerHTML=`<button class="x" data-a="selCancel">${ic('x')}</button><div class="t">${SEL.ids.size} ${SEL.ids.size===1?'seleccionado':'seleccionados'}</div><button class="btn sm" style="background:rgba(255,255,255,.14);color:#fff" data-a="selAll">Todos</button><button class="btn red sm" data-a="selDel">${ic('trash')} Borrar</button>`}
let qT=null,lpT=null,lpX=0,lpY=0,lpFired=false;
document.addEventListener('pointerdown',e=>{lpFired=false;const el=e.target.closest('[data-lp]');if(!el||SEL.list)return;lpX=e.clientX;lpY=e.clientY;lpFired=false;clearTimeout(lpT);lpT=setTimeout(()=>{lpFired=true;startSel(el.dataset.lp,el.dataset.id)},520)});
document.addEventListener('pointermove',e=>{if(lpT&&(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10)){clearTimeout(lpT);lpT=null}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(lpT);lpT=null;if(lpFired)setTimeout(()=>{lpFired=false},450)}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-lp]'))e.preventDefault()});

 const c=document.createElement('canvas');const side=Math.min(img.width,img.height);c.width=c.height=Math.round(Math.min(max,side));const ctx=c.getContext('2d');

function parseCSV(t){const rows=[];let row=[],cur='',q=false;const sep=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':',';
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=''}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(ch!=='\r')cur+=ch}
 if(cur||row.length){row.push(cur);rows.push(row)}return rows}

function analizar(a,b){const r={n:0,ventas:0,gan:0,uds:0,hora:Array(24).fill(0),horaN:Array(24).fill(0),dow:Array(7).fill(0),met:{efectivo:0,transferencia:0,fiao:0},tipo:{tienda:0,delivery:0},prods:{},cats:{},clis:{},dias:{}};
 for(const v of S.ventas){if(v.anulada||v.fecha<a||v.fecha>=b)continue;const tv=v.total-(v.envio||0);r.n++;r.ventas+=tv;r.gan+=v.gan;
  const dt=new Date(v.fecha);r.hora[dt.getHours()]+=tv;r.horaN[dt.getHours()]++;r.dow[dt.getDay()]+=tv;r.met[v.metodo]=(r.met[v.metodo]||0)+tv;r.tipo[v.tipo]=(r.tipo[v.tipo]||0)+tv;
  const k=dkey(v.fecha);const dd=r.dias[k]=r.dias[k]||{v:0,g:0,n:0};dd.v+=tv;dd.g+=v.gan;dd.n++;
  if(v.clienteId){const c=r.clis[v.clienteId]=r.clis[v.clienteId]||{v:0,n:0};c.v+=tv;c.n++}
  for(const i of v.items){const key=i.pid||('s:'+norm(i.nombre));const p=r.prods[key]=r.prods[key]||{pid:i.pid,nombre:i.nombre,cant:0,monto:0,gan:0,unidad:i.unidad};p.cant+=i.cant;p.monto+=i.cant*i.precio;p.gan+=i.cant*(i.precio-i.costo);r.uds+=i.cant;

 </div>

 <div class="card pad"><div class="rh"><h2>Mejores clientes</h2></div>${clis.length?`<div class="list">${clis.map((x,i)=>`<div class="li" data-a="verCli" data-id="${x.c.id}" style="padding:10px 0">${avatar(x.c.nombre)}<div class="grow"><div class="b ell">${esc(x.c.nombre)}</div><div class="muted small">${x.n} ${x.n===1?'compra':'compras'}</div></div><div class="amt num">${fmt(x.v)}</div></div>`).join('')}</div>`:`<p class="muted small">En este período las ventas fueron a clientes de mostrador. Elige un cliente al vender para verlos aquí.</p>`}</div>

/* ============ Contraseña ============ */
let LOCK={on:false,mode:'abrir',buf:'',first:'',fails:0,until:0,cb:null,cancel:null},hiddenAt=0,lockTmr=null;
async function hashPin(pin,salt){const txt=salt+'|'+pin+'|anabomby';try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=2166136261;for(let k=0;k<5000;k++)for(let i=0;i<txt.length;i++){h^=txt.charCodeAt(i)+k;h=Math.imul(h,16777619)>>>0}return 'f'+h.toString(16)}}
const pinOn=()=>!!(S.ajustes.pin&&S.ajustes.pin.hash);
function showLock(mode='abrir',cb=null,cancel=null){if(DLGRES)closeDlg(null);LOCK={...LOCK,on:true,mode,buf:'',first:'',cb,cancel};renderLock();$('#lock').classList.add('on')}
function hideLock(){LOCK.on=false;$('#lock').classList.remove('on')}
function renderLock(){const m=LOCK.mode,P=S.ajustes.pin||{};const wait=LOCK.until>Date.now();
 const tit={abrir:'Escribe tu contraseña',actual:'Escribe tu contraseña actual',crear:'Crea una contraseña',confirmar:'Escríbela otra vez'}[m];
 const sub={abrir:'Para entrar a la app del colmado',actual:'Para confirmar que eres tú',crear:'De 4 a 6 números. No la compartas.',confirmar:'Para estar seguros de que la recuerdas'}[m];
 const n=(m==='abrir'||m==='actual')?(P.len||4):m==='confirmar'?LOCK.first.length:Math.max(4,LOCK.buf.length);
 $('#lock').innerHTML=`<img src="logo.png" alt=""><div class="lt">${tit}</div><div class="ls">${wait?`Demasiados intentos. Espera ${Math.ceil((LOCK.until-Date.now())/1000)} segundos.`:sub}</div>
 <div class="dots" id="lockDots">${Array.from({length:n},(_,i)=>`<i class="${i<LOCK.buf.length?'f':''}"></i>`).join('')}</div>
 <div class="keys">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-a="pk" data-v="${d}" ${wait?'disabled':''}>${d}</button>`).join('')}
 ${m==='crear'?`<button class="kx ok" data-a="pkOk" ${LOCK.buf.length>=4?'':'disabled'}>Listo</button>`:'<span></span>'}<button data-a="pk" data-v="0" ${wait?'disabled':''}>0</button><button class="kx" data-a="pkDel" aria-label="Borrar">⌫</button></div>
 ${m==='abrir'?`<button class="lk" data-a="pkOlvide">¿Olvidaste la contraseña?</button>`:`<button class="lk" data-a="pkCancel">Cancelar</button>`}`}
function lockShake(){const d=$('#lockDots');if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}vib([60,40,60])}
async function pkCheck(){const P=S.ajustes.pin,m=LOCK.mode;
 if(m==='abrir'||m==='actual'){if(LOCK.buf.length<P.len)return;const ok=(await hashPin(LOCK.buf,P.salt))===P.hash;
  if(ok){LOCK.fails=0;if(m==='abrir'){hideLock()}else{const cb=LOCK.cb;cb&&cb()}return}
  LOCK.fails++;LOCK.buf='';if(LOCK.fails>=5){LOCK.fails=0;LOCK.until=Date.now()+30000;clearInterval(lockTmr);lockTmr=setInterval(()=>{if(LOCK.until<=Date.now())clearInterval(lockTmr);if(LOCK.on)renderLock()},1000)}renderLock();lockShake();return}
 if(m==='confirmar'){if(LOCK.buf.length<LOCK.first.length)return;if(LOCK.buf!==LOCK.first){LOCK.mode='crear';LOCK.buf='';LOCK.first='';renderLock();lockShake();toast('No coinciden, inténtalo otra vez','alert');return}
  const salt=uid(),code=Array.from({length:8},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');const rc=code.slice(0,4)+'-'+code.slice(4);
  S.ajustes.pin={hash:await hashPin(LOCK.first,salt),salt,len:LOCK.first.length,rec:await hashPin(rc,salt),bloqueo:(S.ajustes.pin&&S.ajustes.pin.bloqueo!=null)?S.ajustes.pin.bloqueo:5};save();hideLock();render();
  await dialog(`<h3>🔒 Contraseña lista</h3><p>Anota este código en un lugar seguro. Si olvidas la contraseña, con él puedes entrar.</p><div style="text-align:center;font-size:30px;font-weight:900;letter-spacing:.12em;background:var(--card2);border-radius:14px;padding:14px;margin-bottom:16px" class="num">${rc}</div><button class="btn pri full" data-a="dlgSi">Ya lo anoté</button>`)}}
const LA={
 pk:el=>{if(LOCK.until>Date.now())return;if(LOCK.buf.length>=6)return;LOCK.buf+=el.dataset.v;vib(6);const d=$('#lockDots');renderLock();pkCheck()},
 pkDel:()=>{LOCK.buf=LOCK.buf.slice(0,-1);renderLock()},
 pkOk:()=>{if(LOCK.mode==='crear'&&LOCK.buf.length>=4){LOCK.first=LOCK.buf;LOCK.buf='';LOCK.mode='confirmar';renderLock()}},
 pkCancel:()=>{const c=LOCK.cancel;hideLock();c&&c()},
 pkOlvide:async()=>{const r=await dialog(`<h3>¿Olvidaste la contraseña?</h3><p>Escribe el código de recuperación que anotaste al crearla.</p><input class="inp" id="recIn" placeholder="XXXX-XXXX" autocomplete="off" style="text-transform:uppercase;text-align:center;font-weight:900;letter-spacing:.1em"><div class="g2" style="margin-top:16px"><button class="btn ghost" data-a="dlgNo">Cancelar</button><button class="btn pri" data-a="recOk">Entrar</button></div>`);
  if(!r)return;let c=r.toUpperCase().replace(/[^A-Z0-9]/g,'');c=c.slice(0,4)+'-'+c.slice(4,8);const P=S.ajustes.pin;
  if((await hashPin(c,P.salt))===P.rec){S.ajustes.pin={bloqueo:P.bloqueo};save();hideLock();render();toast('Contraseña quitada. Pon una nueva en Ajustes.','check')}else toast('Ese código no es correcto','alert')},
 recOk:()=>closeDlg($('#recIn').value),
 pinCrear:()=>showLock('crear'),
 pinCambiar:()=>showLock('actual',()=>{LOCK.mode='crear';LOCK.buf='';renderLock()}),
 pinQuitar:()=>showLock('actual',()=>{S.ajustes.pin={bloqueo:S.ajustes.pin.bloqueo};save();hideLock();render();toast('Contraseña quitada')}),
 pinBloqueo:el=>{S.ajustes.pin=S.ajustes.pin||{};S.ajustes.pin.bloqueo=+el.dataset.v;save();render()},
 bloquear:()=>{if(pinOn())showLock('abrir')},
};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')hiddenAt=Date.now();else if(pinOn()&&!LOCK.on&&hiddenAt){const b=S.ajustes.pin.bloqueo??5;if(Date.now()-hiddenAt>=b*60000)showLock('abrir')}});
Object.assign(A,LA);
